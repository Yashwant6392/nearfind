{% extends "base.html" %}
{% block content %}
<section class="narrow wide">
  <form class="panel form-card" method="post" action="{{ url_for('auth_signup') }}" data-location-form>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p class="eyebrow">Start nearby discovery</p>
    <h1>Create your account</h1>
    <div class="grid two">
      <label>Name<input name="name" required></label>
      <label>Email<input name="email" type="email" required></label>
      <label>Password<input name="password" type="password" minlength="6" required></label>
      <label>Phone<input name="phone" type="tel" required></label>
      <label class="full">Address<input name="address" required></label>
      <label>Role
        <select name="role" id="roleSelect" required>
          <option value="seeker">Seeker</option>
          <option value="provider">Provider</option>
        </select>
      </label>
      <label id="providerTypeWrap">Provider type
        <select name="provider_type">
          <option value="shop">Shop</option>
          <option value="individual">Individual</option>
        </select>
      </label>
      <label id="businessWrap" class="full">Business name<input name="business_name"></label>
      <label>Latitude<input name="lat" inputmode="decimal" placeholder="Auto or manual"></label>
      <label>Longitude<input name="lng" inputmode="decimal" placeholder="Auto or manual"></label>
    </div>
    <div class="notice" id="locationStatus">Location helps NearFind show real nearby demand.</div>
    <button class="btn primary" type="submit">Create Account</button>
  </form>
</section>
{% endblock %}
