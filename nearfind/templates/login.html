{% extends "base.html" %}
{% block content %}
<section class="narrow">
  <form class="panel form-card" method="post" action="{{ url_for('auth_login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <p class="eyebrow">Welcome Back</p>
      <h1>Login to NearFind</h1>
      <p class="muted" style="margin: 4px 0 0;">Access your hyperlocal requests, active orders, and live messages.</p>
    </div>
    <label>Email
      <input name="email" type="email" autocomplete="email" placeholder="name@example.com" required>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
    </label>
    <button class="btn primary" type="submit" style="width: 100%; margin-top: 6px;">Sign In</button>
    <p class="muted" style="text-align: center; margin: 12px 0 0;">New to NearFind? <a href="{{ url_for('signup') }}" style="color: var(--lime); font-weight: 600;">Create an account</a></p>
  </form>
</section>
{% endblock %}
